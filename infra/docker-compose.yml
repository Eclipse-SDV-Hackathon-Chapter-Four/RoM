# Made with Claude (Claude Code, Anthropic)
# Everything in one place. rom-python = dev image (all packages editable, repo bind-mounted);
# vss-uprotocol-client, guardian, fault-injector and the TODO services use their own images (services/*/Dockerfile).
# Shortcuts: `make up`, `make kuksa` (interactive shell), `make down`, `make help`. Raw commands:
#   docker compose -f infra/docker-compose.yml up -d databroker mosquitto   # brokers
#   docker compose -f infra/docker-compose.yml run --rm kuksa-client         # kuksa-client shell
#   docker compose -f infra/docker-compose.yml run --rm dev bash             # shell in the venv
#   docker compose -f infra/docker-compose.yml run --rm dev pytest            # tests
# iceoryx2 mounts shared by dfm and opensovd (see the iceoryx2 volumes at the bottom).
x-iceoryx2: &iceoryx2 [iceoryx2-shm:/dev/shm, iceoryx2:/tmp/iceoryx2]

services:
  mosquitto:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf   # anonymous access, port 1883 on all interfaces
    ports: ["${MQTT_HOST_PORT:-1883}:1883"]   # AZ3166 board publishes here; `make` stops if 1883 is taken

  databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:${KUKSA_VERSION:-latest}
    # default VSS (inside the image) + the RoM overlay with the 4 battery cells (infra/vss/rom_overlay.json)
    command: --insecure --vss vss_release_6.0.json,/vss/rom_overlay.json
    volumes: ["./vss:/vss:ro,z"]
    ports: ["55555:55555"]

  kuksa-client:
    profiles: ["tools"]          # interactive shell, only started on demand
    build: &pyimage
      context: ..
      dockerfile: infra/Dockerfile
    image: rom-python
    command: kuksa-client grpc://databroker:55555
    stdin_open: true
    tty: true
    working_dir: /history        # kuksa-client writes .vssclient_history into the cwd
    volumes: [kuksa-history:/history]
    depends_on: [databroker]

  simulator:
    profiles: ["tools"]          # sine wave 30-69 °C into KUKSA; tune with SIM_* env vars
    image: rom-python
    build: *pyimage
    working_dir: /app
    volumes: ["..:/app:z"]
    command: python -m simulator.simulator
    restart: on-failure          # databroker may not accept connections yet on first start
    environment:
      KUKSA_HOST: databroker
      SIM_HZ: ${SIM_HZ:-2}
      SIM_PERIOD_S: ${SIM_PERIOD_S:-120}
      SIM_CELLS: ${SIM_CELLS:-1,2,3,4}  # `make hw`: 2,3,4, the real board is cell 1 (adapter)
      SIM_API_HOST: 0.0.0.0            # fault API for the fault-injector (and curl); no authentication
      SIM_API_PORT: 8080
      SIM_COOLING: ${SIM_COOLING:-1}   # cooling actuator: cells cool while the guardian is MITIGATING (simulator/cooling.py)
      SIM_MIN_C: ${SIM_MIN_C:-25}        # idle wave = the campaigns baseline (30-69 C crosses WARN_C before the 1st campaign)
      SIM_MAX_C: ${SIM_MAX_C:-32}
      ZENOH_CONNECT: tcp/guardian:7447 # guardian state up://rom-vehicle/1002/1/8006; Zenoh retries until the guardian is up
    ports: ["127.0.0.1:8080:8080"]     # loopback only: keep the unauthenticated fault API off the network
    depends_on: [databroker]

  adapter:
    profiles: ["tools"]          # MQTT (AZ3166 board, rom/sensor/battery/temp) -> KUKSA; replaces the simulator
    image: rom-python
    build: *pyimage
    working_dir: /app
    volumes: ["..:/app:z"]
    command: rom-adapter
    restart: on-failure
    environment:
      MQTT_HOST: mosquitto
      KUKSA_HOST: databroker
    depends_on: [databroker, mosquitto]

  # --- Service images (services/*/Dockerfile): self-contained, no bind mounts, env-only config ---
  vss-uprotocol-client:
    profiles: ["tools"]          # KUKSA -> uProtocol over Zenoh: cells up://rom-vehicle/1001/1/8002, Max .../8001
    build: {context: .., dockerfile: services/vss-uprotocol-client/Dockerfile}
    image: localhost/rom/vss-uprotocol-client:dev
    restart: on-failure
    environment:
      KUKSA_HOST: databroker
      ZENOH_LISTEN: tcp/0.0.0.0:7447   # guardian connects here; no multicast needed between containers
      FAULT_API_HOST: 0.0.0.0          # transport-fault API (drop, delay, ...) for the fault-injector; no authentication
      FAULT_API_PORT: 8081
    ports: ["127.0.0.1:8081:8081"]     # loopback only
    depends_on: [databroker]

  guardian:
    profiles: ["tools"]          # reads the 4 cells over uProtocol (never KUKSA); fault events up://rom-vehicle/1002/1/8003
    build: {context: .., dockerfile: services/guardian/Dockerfile}
    image: localhost/rom/guardian:dev
    restart: on-failure
    environment:
      ZENOH_CONNECT: tcp/vss-uprotocol-client:7447
      REQUIRED_HEARTBEATS: ${REQUIRED_HEARTBEATS:-uprotocol,databroker}   # `make hw` adds adapter,chip
      ZENOH_LISTEN: tcp/0.0.0.0:7447   # the DFM reporter (and rom-up-monitor --faults) connects here for fault events
      MQTT_HOST: mosquitto             # display command (rom/actuator/display/cmd) goes out over MQTT
    depends_on: [vss-uprotocol-client, mosquitto, dfm]   # dfm first: fault events are not buffered

  dfm:
    profiles: ["tools"]          # fault-lib DFM + bridge: guardian fault events (uProtocol) -> fault records (dfm/query)
    build: {context: .., dockerfile: services/dfm/Dockerfile}
    image: localhost/rom/dfm:dev
    restart: on-failure
    # iceoryx2 shm + files shared with opensovd; fault records survive restarts
    volumes: [iceoryx2-shm:/dev/shm, iceoryx2:/tmp/iceoryx2, dfm-storage:/var/lib/rom-dfm]
    environment:
      ZENOH_CONNECT: tcp/guardian:7447   # guardian publishes up://rom-vehicle/1002/1/8003 and listens on 7447

  opensovd:
    profiles: ["tools"]          # SOVD REST: http://localhost:7690/sovd/v1/apps/battery_guardian/faults (DFM via iceoryx2)
    build: {context: .., dockerfile: services/opensovd/Dockerfile}
    image: localhost/rom/opensovd:dev
    restart: on-failure
    ports: ["7690:7690"]
    volumes: *iceoryx2                 # same iceoryx2 shm + files as the DFM; same user too (iceoryx2 files are owner-only)
    environment:
      SOVD_DFM_APPS: battery_guardian  # DFM entity path = fault catalog id
    depends_on: [dfm]

  fault-injector:
    profiles: ["tools"]          # one-shot: `make campaign C=thermal_runaway` (stack from `make guardian` must be up)
    build: {context: .., dockerfile: services/fault-injector/Dockerfile}
    image: localhost/rom/fault-injector:dev
    environment:
      SIMULATOR_URL: http://simulator:8080
      PUBLISHER_URL: http://vss-uprotocol-client:8081
      UP_CAMPAIGN_EVENTS: "1"                        # campaign events up://rom-vehicle/1003/1/8005 -> evidence collector
      ZENOH_CONNECT: tcp/evidence-collector:7447

  evidence-collector:
    profiles: ["tools"]          # records every RoM topic, judges each campaign run: http://localhost:8082/ui/
    build: {context: .., dockerfile: services/evidence-collector/Dockerfile}
    image: localhost/rom/evidence-collector:dev
    restart: on-failure
    volumes: [evidence-data:/data]   # events.jsonl, evidence.db, evidence/*.json survive restarts
    ports: ["127.0.0.1:8082:8082"]
    environment:
      ZENOH_LISTEN: tcp/0.0.0.0:7447                                          # the fault-injector connects here
      ZENOH_CONNECT: tcp/vss-uprotocol-client:7447,tcp/guardian:7447          # cells + heartbeats, faults + state
      SOVD_URL: http://opensovd:7690/sovd
    depends_on: [guardian, opensovd]

  dev:
    profiles: ["tools"]          # only started on demand
    image: rom-python
    build: *pyimage
    working_dir: /app
    volumes: ["..:/app:z"]         # live code, no rebuild per edit
    environment:
      MQTT_HOST: mosquitto
      KUKSA_HOST: databroker
    depends_on: [databroker]

volumes:
  kuksa-history:
  dfm-storage:
  evidence-data:
  # iceoryx2 between dfm and opensovd: /dev/shm (shared memory) and /tmp/iceoryx2 (service/node files)
  # must live and die together, so both are tmpfs volumes mounted into both containers. A shared IPC
  # namespace (ipc: service:dfm) plus a persistent volume breaks on a DFM restart: the restart gets a
  # fresh /dev/shm while the old service files stay -> ServiceInCorruptedState.
  iceoryx2-shm:
    driver_opts: {type: tmpfs, device: tmpfs}
  iceoryx2:
    driver_opts: {type: tmpfs, device: tmpfs}
