# Made with Claude (Claude Code, Anthropic)
# Everything in one place. rom-python = dev image (all packages editable, repo bind-mounted);
# vss-uprotocol-client, guardian, fault-injector and the TODO services use their own images (services/*/Dockerfile).
# Shortcuts: `make up`, `make kuksa` (interactive shell), `make down`, `make help`. Raw commands:
#   docker compose -f infra/docker-compose.yml up -d databroker mosquitto   # brokers
#   docker compose -f infra/docker-compose.yml run --rm kuksa-client         # kuksa-client shell
#   docker compose -f infra/docker-compose.yml run --rm dev bash             # shell in the venv
#   docker compose -f infra/docker-compose.yml run --rm dev pytest            # tests
services:
  mosquitto:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf   # anonymous access, port 1883 on all interfaces
    ports: ["1883:1883"]

  databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:${KUKSA_VERSION:-latest}
    # default VSS (inside the image) + the RoM overlay with the 4 battery cells (infra/vss/rom_cells.json)
    command: --insecure --vss vss_release_6.0.json,/vss/rom_cells.json
    volumes: ["./vss:/vss:ro,z"]
    ports: ["55555:55555"]

  kuksa-client:
    profiles: ["tools"]          # interactive shell, only started on demand
    build: &pyimage
      context: ..
      dockerfile: infra/Dockerfile
    image: rom-python
    command: kuksa-client grpc://databroker:55555
    stdin_open: true
    tty: true
    working_dir: /history        # kuksa-client writes .vssclient_history into the cwd
    volumes: [kuksa-history:/history]
    depends_on: [databroker]

  simulator:
    profiles: ["tools"]          # sine wave 30-69 °C into KUKSA; tune with SIM_* env vars
    image: rom-python
    build: *pyimage
    working_dir: /app
    volumes: ["..:/app:z"]
    command: python -m simulator.simulator
    restart: on-failure          # databroker may not accept connections yet on first start
    environment:
      KUKSA_HOST: databroker
      SIM_HZ: ${SIM_HZ:-2}
      SIM_PERIOD_S: ${SIM_PERIOD_S:-120}
      SIM_API_HOST: 0.0.0.0            # fault API for the fault-injector (and curl); no authentication
      SIM_API_PORT: 8080
    ports: ["127.0.0.1:8080:8080"]     # loopback only: keep the unauthenticated fault API off the network
    depends_on: [databroker]

  adapter:
    profiles: ["tools"]          # MQTT (AZ3166 board, rom/sensor/battery/temp) -> KUKSA; replaces the simulator
    image: rom-python
    build: *pyimage
    working_dir: /app
    volumes: ["..:/app:z"]
    command: rom-adapter
    restart: on-failure
    environment:
      MQTT_HOST: mosquitto
      KUKSA_HOST: databroker
    depends_on: [databroker, mosquitto]

  # --- Service images (services/*/Dockerfile): self-contained, no bind mounts, env-only config ---
  vss-uprotocol-client:
    profiles: ["tools"]          # KUKSA -> uProtocol over Zenoh (topic up://rom-vehicle/1001/1/8001)
    build: {context: .., dockerfile: services/vss-uprotocol-client/Dockerfile}
    image: localhost/rom/vss-uprotocol-client:dev
    restart: on-failure
    environment:
      KUKSA_HOST: databroker
      ZENOH_LISTEN: tcp/0.0.0.0:7447   # guardian connects here; no multicast needed between containers
      FAULT_API_HOST: 0.0.0.0          # transport-fault API (drop, delay, ...) for the fault-injector; no authentication
      FAULT_API_PORT: 8081
    ports: ["127.0.0.1:8081:8081"]     # loopback only
    depends_on: [databroker]

  guardian:
    profiles: ["tools"]          # reads the battery temp over uProtocol (never KUKSA), logs state changes as JSON
    build: {context: .., dockerfile: services/guardian/Dockerfile}
    image: localhost/rom/guardian:dev
    restart: on-failure
    environment:
      ZENOH_CONNECT: tcp/vss-uprotocol-client:7447
      MQTT_HOST: mosquitto             # display command (rom/actuator/display/cmd) goes out over MQTT
    depends_on: [vss-uprotocol-client, mosquitto]

  fault-injector:
    profiles: ["tools"]          # one-shot: `make campaign C=thermal_runaway` (stack from `make guardian` must be up)
    build: {context: .., dockerfile: services/fault-injector/Dockerfile}
    image: localhost/rom/fault-injector:dev
    environment:
      SIMULATOR_URL: http://simulator:8080
      PUBLISHER_URL: http://vss-uprotocol-client:8081

  # --- TODO placeholders: images build and start, log "not_implemented" and exit ---
  dfm:
    profiles: ["todo"]
    build: {context: .., dockerfile: services/dfm/Dockerfile}
    image: localhost/rom/dfm:dev

  opensovd:
    profiles: ["todo"]
    build: {context: .., dockerfile: services/opensovd/Dockerfile}
    image: localhost/rom/opensovd:dev

  evidence-collector:
    profiles: ["todo"]
    build: {context: .., dockerfile: services/evidence-collector/Dockerfile}
    image: localhost/rom/evidence-collector:dev

  dev:
    profiles: ["tools"]          # only started on demand
    image: rom-python
    build: *pyimage
    working_dir: /app
    volumes: ["..:/app:z"]         # live code, no rebuild per edit
    environment:
      MQTT_HOST: mosquitto
      KUKSA_HOST: databroker
    depends_on: [databroker]

volumes:
  kuksa-history:
