[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-dfm"
version = "0.1.0"
description = "RoM Diagnostic Fault Manager (DFM) (placeholder)"
requires-python = ">=3.10"
dependencies = ["rom-common"]

[project.scripts]
rom-dfm = "dfm.__main__:main"

[tool.setuptools]
packages = ["dfm"]
