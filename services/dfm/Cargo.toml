# Made with Claude (Claude Code, Anthropic)
# Built as a member of the fault-lib workspace (see Dockerfile), so it uses the exact
# fault-lib / iceoryx2 versions of dfm_bin: the IPC types must match byte for byte.
[package]
name = "rom_dfm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rom-dfm"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
fault_lib = { path = "../fault_lib" }
dfm_lib = { path = "../dfm_lib" }
iceoryx2-bb-container.workspace = true
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
up-rust = { version = "0.9", default-features = false }
up-transport-zenoh = "0.9.1"
tiny_http = "0.12"
