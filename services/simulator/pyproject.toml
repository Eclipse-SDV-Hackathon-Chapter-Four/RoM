# Made with Claude (Claude Code, Anthropic)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-simulator"
version = "0.1.0"
description = "RoM sine-wave battery temperature simulator writing into KUKSA"
requires-python = ">=3.10"
dependencies = ["rom-common[kuksa]"]

[project.optional-dependencies]
cooling = ["rom-uprotocol"]   # SIM_COOLING=1: guardian state over uProtocol (plus up-python, --no-deps)

[project.scripts]
rom-simulator = "simulator.simulator:main"

[tool.setuptools]
packages = ["simulator"]
