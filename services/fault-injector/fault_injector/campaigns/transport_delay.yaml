# Made with Claude (Claude Code, Anthropic)
# Messages arrive 2.5 s late (longer than the 2 s TTL / stale limit). Needs the publisher fault API.
run_id: transport-delay-01
seed: 7
hazard: "H7: delayed delivery makes the guardian act on old data"
safety_goal: "SG5: late data must not be treated as current"
expected_state: SENSOR_FAULT
expected_faults: [battery_guardian.signal_stale]
max_detect_ms: 5000
baseline: {min_c: 25, max_c: 32, period_s: 120}
faults:
  - {at_s: 10, duration_s: 10, target: publisher, type: delay, params: {ms: 2500, topic: signal}}
