# Made with Claude (Claude Code, Anthropic)
# One cell heats up steadily: the guardian must warn, then go CRITICAL (cooling requested) before the pack is lost.
run_id: thermal-runaway-01
seed: 7
hazard: "H1: thermal runaway of a single traction battery cell"
safety_goal: "SG1: warn at 38 °C and request cooling at 45 °C pack maximum"
expected_state: CRITICAL
max_detect_ms: 35000            # drift starts at 10 s and takes about 25 s to cross 45 °C
baseline: {min_c: 25, max_c: 32, period_s: 120}
faults:
  - {at_s: 10, duration_s: 50, target: simulator, type: drift, cell: 1, params: {rate_c_per_s: 0.7}}
