# Made with Claude (Claude Code, Anthropic)
# Multi-fault: cell 3's sensor is stuck while cell 1 overheats. The stuck cell gets its own code and is left out;
# the pack warning keeps running on the healthy cells and still reaches CRITICAL.
run_id: cell-faulty-while-other-hot-01
seed: 7
hazard: "H1+H2: thermal runaway in one cell while another cell's sensor is faulty"
safety_goal: "SG1: warn at 38 °C and request cooling at 45 °C even if another sensor is faulty"
expected_state: CRITICAL
expected_faults: [battery_guardian.cell3.signal_stuck, battery_guardian.over_temp_warning,
                  battery_guardian.over_temp_critical, battery_guardian.cell_imbalance]
max_detect_ms: 35000
baseline: {min_c: 25, max_c: 32, period_s: 120}
faults:
  - {at_s: 5, duration_s: 55, target: simulator, type: stuck, cell: 3}
  - {at_s: 10, duration_s: 50, target: simulator, type: drift, cell: 1, params: {rate_c_per_s: 0.7}}
