# Made with Claude (Claude Code, Anthropic)
# The uProtocol heartbeats are lost while the cell messages still arrive. Needs the publisher fault API.
run_id: uprotocol-heartbeat-loss-01
seed: 7
hazard: "H6: uProtocol link or client degraded"
safety_goal: "SG6: a missing link heartbeat is reported as such, not as a sensor problem"
expected_state: SENSOR_FAULT      # reason: "uP link lost"
expected_faults: [battery_guardian.uprotocol_lost]
max_detect_ms: 3000
baseline: {min_c: 25, max_c: 32, period_s: 120}
faults:
  - {at_s: 10, duration_s: 8, target: publisher, type: drop, params: {topic: heartbeat}}
