# Made with Claude (Claude Code, Anthropic)
# All four cell sensors freeze (a stuck sensor bus): a flat line must not be trusted as "all fine".
# Every cell has its own stuck DTC; sensor_stuck_cell3 freezes a single cell.
run_id: sensor-stuck-01
seed: 7
hazard: "H2: frozen temperature sensor hides a developing fault"
safety_goal: "SG2: detect a stuck signal within 10 s and treat it as a sensor fault"
expected_state: SENSOR_FAULT
expected_faults:
  - battery_guardian.cell1.signal_stuck
  - battery_guardian.cell2.signal_stuck
  - battery_guardian.cell3.signal_stuck
  - battery_guardian.cell4.signal_stuck
max_detect_ms: 12000            # guardian STUCK_S = 10 s
baseline: {min_c: 25, max_c: 32, period_s: 120}
faults:
  - {at_s: 10, duration_s: 20, target: simulator, type: stuck}
