# Made with Claude (Claude Code, Anthropic)
# Cell 1 heats up while cell messages swap places in pairs: an older, cooler value arriving late must never
# lower the state; the guardian still warns, goes CRITICAL and requests cooling, and names the degraded link.
# Needs the vss-uprotocol-client fault API (FAULT_API_PORT, PUBLISHER_URL).
run_id: reorder-during-runaway-01
seed: 7
hazard: "H1+H11: thermal runaway of one cell while cell messages arrive out of order"
safety_goal: "SG1: warn at 38 °C and request cooling at 45 °C pack maximum, also with a degraded link"
expected_state: CRITICAL
expected_faults: [battery_guardian.over_temp_warning, battery_guardian.over_temp_critical,
                  battery_guardian.cell_imbalance, battery_guardian.link_integrity]
max_detect_ms: 35000            # drift starts at 10 s and takes about 25 s to cross 45 °C
baseline: {min_c: 25, max_c: 32, period_s: 120}
faults:
  - {at_s: 10, duration_s: 50, target: simulator, type: drift, cell: 1, params: {rate_c_per_s: 0.7}}
  - {at_s: 15, duration_s: 30, target: publisher, type: reorder, params: {topic: signal}}
